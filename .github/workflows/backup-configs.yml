name: Backup network configuration

# Daily encrypted snapshot of the Meraki configuration, so a mistaken change or
# a device swap can be reversed from a known-good copy rather than from memory.
#
# WHY ENCRYPTED: the snapshot contains SSID pre-shared keys and the full
# firewall ruleset, and this repository is public. Only ciphertext is ever
# committed. The passphrase lives in the BACKUP_PASSPHRASE secret and is the
# only thing that can open these files — if it is lost, so are the backups.

on:
  schedule:
    - cron: "20 16 * * *"   # 03:20 Sydney (AEST, UTC+10)
  workflow_dispatch:

permissions:
  contents: write

env:
  RETAIN: 30   # snapshots to keep

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Capture configuration
        env:
          MERAKI_API_KEY: ${{ secrets.MERAKI_API }}
          # Outside the working tree on purpose — plaintext config must never
          # sit where a stray `git add` could publish it.
          BACKUP_OUT: /tmp/meraki-config-backup.json
          MANIFEST_OUT: /tmp/backup-manifest.json
        run: node scripts/backup-configs.js

      - name: Encrypt and store
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${BACKUP_PASSPHRASE:-}" ]; then
            echo "BACKUP_PASSPHRASE is not set."
            echo ""
            echo "Refusing to continue: without it the only options are to commit"
            echo "SSID pre-shared keys and firewall rules in plaintext to a public"
            echo "repository, or to silently store nothing. Neither is acceptable."
            echo ""
            echo "Generate one and add it as a repository secret:"
            echo "  openssl rand -base64 32"
            exit 1
          fi

          mkdir -p backups
          STAMP=$(date -u +%Y-%m-%dT%H%M%SZ)
          FILE="backups/meraki-${STAMP}.json.gpg"

          gpg --batch --yes --symmetric --cipher-algo AES256 \
              --passphrase "$BACKUP_PASSPHRASE" \
              --output "$FILE" /tmp/meraki-config-backup.json
          shred -u /tmp/meraki-config-backup.json

          echo "wrote $FILE ($(stat -c%s "$FILE") bytes)"

          # Verify the file can actually be opened again. A backup that has
          # never been restored is a hope, not a backup.
          gpg --batch --yes --quiet --decrypt --passphrase "$BACKUP_PASSPHRASE" \
              "$FILE" > /tmp/verify.json 2>/dev/null
          node -e '
            const j=require("/tmp/verify.json");
            if(!j.networks || !j.networks.length) { console.error("restore check FAILED: no networks"); process.exit(1); }
            console.log(`restore check OK: ${j.networks.length} networks readable from the encrypted file`);
          '
          shred -u /tmp/verify.json

          # Prune oldest beyond the retention window.
          ls -1 backups/meraki-*.json.gpg | sort | head -n -${RETAIN} | while read -r old; do
            echo "pruning $old"
            git rm -q "$old"
          done

          # Exported, not just set: the node step below reads them from the
          # environment, and a plain shell variable is invisible to it.
          export FILE
          export SIZE=$(stat -c%s "$FILE")
          export SHA=$(sha256sum "$FILE" | cut -d' ' -f1)
          export COUNT=$(ls -1 backups/meraki-*.json.gpg 2>/dev/null | wc -l)
          export OLDEST=$(ls -1 backups/meraki-*.json.gpg | sort | head -1)
          export RETAIN

          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("/tmp/backup-manifest.json","utf8"));
            const hist = (() => {
              try { return new Function(fs.readFileSync("data/backups.js","utf8")+"; return BACKUPS;")().snapshots || []; }
              catch (e) { return []; }
            })();
            hist.push({
              at: m.capturedAt,
              file: process.env.FILE,
              bytes: Number(process.env.SIZE),
              sha256: process.env.SHA,
              networks: m.networks,
              devices: m.devices,
              counts: m.counts,
              restoreChecked: true,
            });
            const snapshots = hist.slice(-Number(process.env.RETAIN));
            const banner = [
              "// Index of encrypted configuration backups.",
              "// Generated by .github/workflows/backup-configs.yml — do not edit by hand.",
              "//",
              "// Counts and checksums ONLY. The backups themselves are AES-256",
              "// encrypted because they contain SSID pre-shared keys and firewall",
              "// rules, and this repository is public. Nothing here reveals",
              "// configuration; it exists so the dashboard can show that backups are",
              "// running, how much they cover, and when the last one was verified.",
            ].join("\n");
            fs.writeFileSync("data/backups.js",
              `${banner}\nconst BACKUPS = ${JSON.stringify({
                updatedAt: new Date().toISOString(),
                source: m.source,
                retain: Number(process.env.RETAIN),
                oldest: process.env.OLDEST,
                total: Number(process.env.COUNT),
                snapshots,
              }, null, 2)};\n`);
            console.log("wrote data/backups.js");
          '

      - name: Commit
        run: |
          git add backups data/backups.js
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add encrypted configuration backup"
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt) — rebasing onto origin/main"
            git pull --rebase --autostash origin main || exit 1
            sleep $((attempt * 3))
          done
          exit 1
