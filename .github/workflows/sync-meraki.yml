# calls the school's systems on its own.
#
# THIS DOES NOT REVOKE ANYTHING. The API credentials in this repository's
# Actions secrets remain valid until they are deleted here AND revoked in each
# vendor's console. Removing a cron entry stops this repository asking; it does
# not stop the keys working for anyone else who holds them.
#
# Re-enabling is a one-line change, so treat this file as live until the
# credentials themselves are gone.
name: Sync Meraki estate

# Populates data/wireless.js with the Meraki access points, switches and
# sensors. See scripts/meraki-devices.js for what is deliberately not written.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build data/wireless.js from Meraki
        env:
          MERAKI_API: ${{ secrets.MERAKI_API }}
        run: node scripts/meraki-devices.js

      - name: Commit if changed
        run: |
          git add data/wireless.js
          if git diff --cached --quiet -- data/wireless.js; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Meraki estate"
          # Six sync workflows push to main on overlapping schedules, so a
          # plain push loses the race whenever another lands first. Rebase and
          # retry: each workflow owns its own data file, so the rebase cannot
          # conflict — it only needs to move on top of whatever arrived.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt) — rebasing onto origin/main"
            git pull --rebase --autostash origin main || exit 1
            sleep $((attempt * 3))
          done
          echo "still could not push after 5 attempts"
          exit 1
