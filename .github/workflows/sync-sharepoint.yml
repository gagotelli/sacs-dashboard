name: Sync SharePoint document index

# Walks the 05Infrastructure library via Microsoft Graph and writes
# data/sharepoint.js. Names, paths, sizes, modified dates and links only —
# no file content is ever downloaded. See scripts/sharepoint-index.js.

on:
  schedule:
    - cron: "35 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build data/sharepoint.js from Microsoft Graph
        env:
          SHAREPOINT_TENANT_ID: ${{ secrets.SHAREPOINT_TENANT_ID }}
          SHAREPOINT_CLIENT_ID: ${{ secrets.SHAREPOINT_CLIENT_ID }}
          SHAREPOINT_CLIENT_SECRET: ${{ secrets.SHAREPOINT_CLIENT_SECRET }}
          SHAREPOINT_EXCLUDE: ${{ secrets.SHAREPOINT_EXCLUDE }}
        run: node scripts/sharepoint-index.js

      - name: Commit if changed
        run: |
          git add data/sharepoint.js
          if git diff --cached --quiet -- data/sharepoint.js; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update SharePoint document index"
          # Six sync workflows push to main on overlapping schedules, so a
          # plain push loses the race whenever another lands first. Rebase and
          # retry: each workflow owns its own data file, so the rebase cannot
          # conflict — it only needs to move on top of whatever arrived.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt) — rebasing onto origin/main"
            git pull --rebase --autostash origin main || exit 1
            sleep $((attempt * 3))
          done
          echo "still could not push after 5 attempts"
          exit 1
