name: Sync endpoint summary from NinjaOne

# Populates data/endpoints.js with managed-endpoint and alert counts.
# Aggregates only — see scripts/ninjaone-endpoints.js for why.

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build data/endpoints.js from NinjaOne
        env:
          NINJA_CLIENT_ID: ${{ secrets.NINJA_CLIENT_ID }}
          NINJA_CLIENT_SECRET: ${{ secrets.NINJA_CLIENT_SECRET }}
          NINJA_HOST: ${{ secrets.NINJA_HOST }}
        run: node scripts/ninjaone-endpoints.js

      - name: Commit if changed
        run: |
          # `git diff` is blind to untracked files, so on the very first run
          # this would report "no change" for a file that did not exist yet
          # and never commit it. Stage first, then diff the index.
          git add data/endpoints.js
          if git diff --cached --quiet -- data/endpoints.js; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update endpoint summary from NinjaOne"
          # Six sync workflows push to main on overlapping schedules, so a
          # plain push loses the race whenever another lands first. Rebase and
          # retry: each workflow owns its own data file, so the rebase cannot
          # conflict — it only needs to move on top of whatever arrived.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt) — rebasing onto origin/main"
            git pull --rebase --autostash origin main || exit 1
            sleep $((attempt * 3))
          done
          echo "still could not push after 5 attempts"
          exit 1
