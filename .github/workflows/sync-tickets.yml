# DISCONNECTED 2026-07-29 — the maintainer no longer works at St Andrew's
# Cathedral School. The schedule below was removed so this workflow no longer
# calls the school's systems on its own.
#
# THIS DOES NOT REVOKE ANYTHING. The API credentials in this repository's
# Actions secrets remain valid until they are deleted here AND revoked in each
# vendor's console. Removing a cron entry stops this repository asking; it does
# not stop the keys working for anyone else who holds them.
#
# Re-enabling is a one-line change, so treat this file as live until the
# credentials themselves are gone.
name: Sync ManageEngine ticket counts

# Writes aggregate ticket counts into data/tickets.js.
#
# Only ever asks the API for `id` plus a total_count — never subjects,
# requester names, or descriptions. This repo is public and helpdesk tickets
# routinely contain student and staff details, so nothing beyond bucket counts
# is allowed to leave ManageEngine.

on:
  workflow_dispatch:
    inputs:
      grant_code:
        description: >-
          Optional. Paste a fresh Zoho grant code here to run using it
          directly, bypassing the stored refresh token. Generate it at
          api-console.zoho.com (Self Client, Generate Code, scope
          SDPOnDemand.requests.ALL). Single-use and expires in ~10 minutes.
        required: false
        default: ""

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch counts and write data/tickets.js
        env:
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          GRANT_CODE: ${{ inputs.grant_code }}
          GH_SECRET_WRITE_TOKEN: ${{ secrets.GH_SECRET_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          API="https://sacs.sdpondemand.manageengine.com/api/v3"
          HDR_ACCEPT="Accept: application/vnd.manageengine.sdp.v3+json"

          # Zoho's grant code, access token and refresh token are all
          # "1000.<32hex>.<32hex>" and 70 chars, so they are trivially confused
          # when copying by hand. Try the stored value as a refresh token
          # first; if that fails, fall back to treating it as a grant code.
          # A grant code left in the secret is useless otherwise, so trying it
          # can only help — but it is single-use, hence the warning below.
          ACCESS_TOKEN=""

          # An authorization_code exchange returns a refresh token; a
          # refresh_token grant does not. Whenever we get one, store it so the
          # next scheduled run needs no human step. Without the PAT this is a
          # no-op and the sync still works, it just is not self-sustaining.
          persist_refresh_token() {  # $1 = token response json
            local rt
            rt=$(jq -r '.refresh_token // empty' "$1")
            # Explicit if, not "[ -z ] && return": under set -e an AND-list
            # whose first command fails is a well-known way to abort a job.
            if [ -z "$rt" ]; then return 0; fi
            echo "::add-mask::$rt"
            if [ -z "${GH_SECRET_WRITE_TOKEN:-}" ]; then
              echo "A refresh token was issued but GH_SECRET_WRITE_TOKEN is not set,"
              echo "so it cannot be saved — this run succeeds once and the schedule"
              echo "will still fail. Add that secret to make this self-sustaining."
              return 0
            fi
            npm install --no-save --silent --no-fund --no-audit libsodium-wrappers >/dev/null 2>&1
            SECRET_NAME=ZOHO_REFRESH_TOKEN SECRET_VALUE="$rt" node scripts/set-github-secret.js \
              && echo "ZOHO_REFRESH_TOKEN updated — future runs need no grant code." \
              || echo "Could not store the refresh token; see the error above."
          }

          # A grant code pasted into the workflow input wins: it is the
          # recovery path when the stored refresh token is wrong or dead,
          # and it avoids copying tokens between a terminal and GitHub —
          # the step that has repeatedly corrupted the stored value.
          if [ -n "${GRANT_CODE:-}" ]; then
            echo "=== exchanging the grant code supplied as a workflow input ==="
            curl -sS -X POST "https://accounts.zoho.com/oauth/v2/token" \
              --data-urlencode "grant_type=authorization_code" \
              --data-urlencode "client_id=$ZOHO_CLIENT_ID" \
              --data-urlencode "client_secret=$ZOHO_CLIENT_SECRET" \
              --data-urlencode "code=$GRANT_CODE" \
              -o token0.json
            ACCESS_TOKEN=$(jq -r '.access_token // empty' token0.json)
            if [ -z "$ACCESS_TOKEN" ]; then
              echo "grant code rejected: $(jq -r '.error // "unknown"' token0.json)"
              echo "Codes are single-use and expire in ~10 minutes — generate a"
              echo "fresh one and re-run straight away."
              exit 1
            fi
            echo "OK: grant code accepted."
            persist_refresh_token token0.json
          fi

          if [ -z "$ACCESS_TOKEN" ]; then
          echo "=== refreshing access token ==="
          curl -sS -X POST "https://accounts.zoho.com/oauth/v2/token" \
            --data-urlencode "grant_type=refresh_token" \
            --data-urlencode "client_id=$ZOHO_CLIENT_ID" \
            --data-urlencode "client_secret=$ZOHO_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$ZOHO_REFRESH_TOKEN" \
            -o token.json
          ACCESS_TOKEN=$(jq -r '.access_token // empty' token.json)

          if [ -n "$ACCESS_TOKEN" ]; then
            echo "OK: stored value is a valid refresh token (sync is self-sustaining)"
          else
            echo "refresh_token grant failed: $(jq -r '.error // "unknown"' token.json)"
            echo "falling back to treating the stored value as a grant code..."
            curl -sS -X POST "https://accounts.zoho.com/oauth/v2/token" \
              --data-urlencode "grant_type=authorization_code" \
              --data-urlencode "client_id=$ZOHO_CLIENT_ID" \
              --data-urlencode "client_secret=$ZOHO_CLIENT_SECRET" \
              --data-urlencode "code=$ZOHO_REFRESH_TOKEN" \
              -o token2.json
            ACCESS_TOKEN=$(jq -r '.access_token // empty' token2.json)
            if [ -z "$ACCESS_TOKEN" ]; then
              echo "grant_code path also failed: $(jq -r '.error // "unknown"' token2.json)"
              echo ""
              echo "ZOHO_REFRESH_TOKEN holds neither a valid refresh token nor an"
              echo "unused grant code. Generate a fresh code and exchange it, then"
              echo "store the refresh_token field from the exchange RESPONSE."
              exit 1
            fi
            echo "NOTE: stored value was a GRANT CODE, not a refresh token."
            persist_refresh_token token2.json
          fi
          fi

          # Count-only query: row_count 1 so no ticket rows come back in bulk,
          # and fields_required is just id. The number we want is total_count.
          count_for() {  # $1 = search_criteria JSON array, or "" for no filter
            local q
            if [ -z "$1" ]; then
              q=$(jq -nc '{list_info:{row_count:1,start_index:1,get_total_count:true,fields_required:["id"]}}')
            else
              q=$(jq -nc --argjson c "$1" '{list_info:{row_count:1,start_index:1,get_total_count:true,fields_required:["id"],search_criteria:$c}}')
            fi
            curl -sS -G "$API/requests" \
              -H "Authorization: Zoho-oauthtoken $ACCESS_TOKEN" \
              -H "$HDR_ACCEPT" \
              --data-urlencode "input_data=$q" -o c.json
            jq -r '.list_info.total_count // 0' c.json
          }

          # The /status and /priority metadata endpoints need a setup scope
          # this token does not have (they returned empty), so read the
          # vocabulary off the tickets instead. Sample the newest and the
          # oldest tickets: newest are mostly open, oldest mostly closed, so
          # between them they cover the full set of names in practice.
          # Only status and priority fields are requested — never subjects
          # or requester names.
          echo "=== sampling tickets to discover status and priority names ==="
          # category / request_type describe what a ticket is ABOUT without
          # naming anyone, so they are safe to publish. Subject, requester and
          # description are deliberately never requested.
          #
          # `technician` is the IT staff member a ticket is ASSIGNED to, not the
          # person who raised it. Assignee is team workload; requester is who
          # was having the problem, which on a public repo would name students
          # and staff — that field stays unrequested.
          sample() {  # $1 = asc|desc
            local q
            q=$(jq -nc --arg o "$1" \
              '{list_info:{row_count:100,start_index:1,get_total_count:false,
                           fields_required:["status","priority","category","request_type","technician"],
                           sort_field:"created_time",sort_order:$o}}')
            curl -sS -G "$API/requests" \
              -H "Authorization: Zoho-oauthtoken $ACCESS_TOKEN" \
              -H "$HDR_ACCEPT" \
              --data-urlencode "input_data=$q"
          }
          sample desc > s1.json
          sample asc  > s2.json

          # Union the sampled names with the ServiceDesk Plus defaults, so a
          # bucket that happens to be absent from the sample is still counted.
          ALL_STATUSES=$(jq -s -c '
            ([ .[] | .requests[]? | .status?.name? // empty ]
             + ["Open","Closed","Resolved","On Hold","Cancelled"])
            | unique' s1.json s2.json)
          ALL_PRIORITIES=$(jq -s -c '
            ([ .[] | .requests[]? | .priority?.name? // empty ]
             + ["Low","Medium","High","Urgent"])
            | unique' s1.json s2.json)
          # Cap the category list: each name costs one count query, and a long
          # tail of rare categories is noise on the chart anyway.
          ALL_CATEGORIES=$(jq -s -c '
            [ .[] | .requests[]? | .category?.name? // empty ] | unique | .[0:14]' s1.json s2.json)
          echo "categories found: $(echo "$ALL_CATEGORIES" | jq -c .)"
          # Technician names only — no email, no id, no requester. Capped at 20
          # because each name costs two count queries below.
          ALL_TECHNICIANS=$(jq -s -c '
            [ .[] | .requests[]? | .technician?.name? // empty ] | unique | .[0:20]' s1.json s2.json)
          echo "technicians found: $(echo "$ALL_TECHNICIANS" | jq 'length')"

          # Anything not obviously finished counts as open.
          OPEN_STATUSES=$(echo "$ALL_STATUSES" | jq -c '
            [ .[] | select(ascii_downcase | test("close|resolve|cancel|complete") | not) ]')

          echo "open statuses: $(echo "$OPEN_STATUSES" | jq -c .)"
          echo "all statuses:  $(echo "$ALL_STATUSES"  | jq -c .)"
          echo "priorities:    $(echo "$ALL_PRIORITIES" | jq -c .)"

          TOTAL=$(count_for "")
          echo "total tickets: $TOTAL"

          OPEN_CRIT=$(jq -nc --argjson v "$OPEN_STATUSES" \
            '[{field:"status.name",condition:"is",values:$v}]')
          OPEN=$(count_for "$OPEN_CRIT")
          echo "open tickets: $OPEN"

          # Counts per status, across all tickets. Read names line by line —
          # status and priority names contain spaces ("On Hold", "In Progress").
          BY_STATUS="[]"
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            crit=$(jq -nc --arg n "$name" '[{field:"status.name",condition:"is",value:$n}]')
            n=$(count_for "$crit")
            echo "  status '$name': $n"
            BY_STATUS=$(echo "$BY_STATUS" | jq -c --arg l "$name" --argjson v "$n" '. + [{label:$l,value:$v}]')
          done < <(echo "$ALL_STATUSES" | jq -r '.[]')

          # Counts per priority, restricted to open tickets — a priority
          # breakdown over closed history would not be actionable.
          BY_PRIORITY="[]"
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            crit=$(jq -nc --arg n "$name" --argjson v "$OPEN_STATUSES" \
              '[{field:"status.name",condition:"is",values:$v},
                {field:"priority.name",condition:"is",value:$n,logical_operator:"AND"}]')
            n=$(count_for "$crit")
            echo "  priority '$name' (open only): $n"
            BY_PRIORITY=$(echo "$BY_PRIORITY" | jq -c --arg l "$name" --argjson v "$n" '. + [{label:$l,value:$v}]')
          done < <(echo "$ALL_PRIORITIES" | jq -r '.[]')

          # Open tickets with no priority set still need to appear, or the
          # donut will not add up to the open total.
          ASSIGNED=$(echo "$BY_PRIORITY" | jq '[.[].value] | add // 0')
          UNASSIGNED=$(( OPEN - ASSIGNED ))
          if [ "$UNASSIGNED" -gt 0 ]; then
            BY_PRIORITY=$(echo "$BY_PRIORITY" | jq -c --argjson v "$UNASSIGNED" '. + [{label:"Unassigned",value:$v}]')
          fi

          URGENT=$(echo "$BY_PRIORITY" | jq -r '
            ([ .[] | select(.label | ascii_downcase | test("urgent|critical|p1")) | .value ] | add) // 0')

          # What open tickets are ABOUT, by category. Counts only — this is the
          # safe substitute for publishing subject lines from a public repo.
          BY_CATEGORY="[]"
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            crit=$(jq -nc --arg n "$name" --argjson v "$OPEN_STATUSES" \
              '[{field:"status.name",condition:"is",values:$v},
                {field:"category.name",condition:"is",value:$n,logical_operator:"AND"}]')
            n=$(count_for "$crit")
            echo "  category '$name' (open only): $n"
            BY_CATEGORY=$(echo "$BY_CATEGORY" | jq -c --arg l "$name" --argjson v "$n" '. + [{label:$l,value:$v}]')
          done < <(echo "$ALL_CATEGORIES" | jq -r '.[]')
          BY_CATEGORY=$(echo "$BY_CATEGORY" | jq -c '[ .[] | select(.value > 0) ] | sort_by(-.value)')
          # Many tickets carry no category at all, so the buckets alone fall
          # well short of the open total. Surface the remainder rather than
          # letting the chart quietly under-report.
          CAT_SUM=$(echo "$BY_CATEGORY" | jq '[.[].value] | add // 0')
          if [ "$CAT_SUM" -lt "$OPEN" ]; then
            BY_CATEGORY=$(echo "$BY_CATEGORY" | jq -c --argjson v "$(( OPEN - CAT_SUM ))" \
              '. + [{label:"Uncategorised",value:$v}]')
          fi

          # Workload per technician: how many open tickets each person is
          # carrying, and how many they have handled all-time. Ranked by open
          # count, because that is the one that says who needs help this week.
          #
          # Two counts per name rather than one: open alone rewards whoever
          # closes fastest by making them look idle, and all-time alone just
          # ranks by tenure. Together they read as workload plus experience.
          echo "=== counting tickets per technician ==="
          BY_TECH="[]"
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            ocrit=$(jq -nc --arg n "$name" --argjson v "$OPEN_STATUSES" \
              '[{field:"status.name",condition:"is",values:$v},
                {field:"technician.name",condition:"is",value:$n,logical_operator:"AND"}]')
            o=$(count_for "$ocrit")
            tcrit=$(jq -nc --arg n "$name" '[{field:"technician.name",condition:"is",value:$n}]')
            t=$(count_for "$tcrit")
            echo "  technician '$name': $o open, $t total"
            BY_TECH=$(echo "$BY_TECH" | jq -c --arg l "$name" --argjson o "$o" --argjson t "$t" \
              '. + [{label:$l,open:$o,total:$t}]')
          done < <(echo "$ALL_TECHNICIANS" | jq -r '.[]')

          # Unassigned open tickets belong on this list too — a queue nobody
          # owns is the most important row here, not a rounding error.
          TECH_OPEN_SUM=$(echo "$BY_TECH" | jq '[.[].open] | add // 0')
          if [ "$TECH_OPEN_SUM" -lt "$OPEN" ]; then
            BY_TECH=$(echo "$BY_TECH" | jq -c --argjson v "$(( OPEN - TECH_OPEN_SUM ))" \
              '. + [{label:"Unassigned",open:$v,total:null}]')
          fi
          BY_TECH=$(echo "$BY_TECH" | jq -c '[ .[] | select(.open > 0 or (.total // 0) > 0) ] | sort_by(-.open)')

          # Open tickets per status x priority, so the page can show where the
          # urgent work actually sits rather than just how much there is.
          MATRIX="[]"
          while IFS= read -r st; do
            [ -z "$st" ] && continue
            row="[]"
            while IFS= read -r pr; do
              [ -z "$pr" ] && continue
              crit=$(jq -nc --arg s "$st" --arg p "$pr" \
                '[{field:"status.name",condition:"is",value:$s},
                  {field:"priority.name",condition:"is",value:$p,logical_operator:"AND"}]')
              n=$(count_for "$crit")
              row=$(echo "$row" | jq -c --arg l "$pr" --argjson v "$n" '. + [{label:$l,value:$v}]')
            done < <(echo "$ALL_PRIORITIES" | jq -r '.[]')
            if [ "$(echo "$row" | jq '[.[].value] | add // 0')" -gt 0 ]; then
              MATRIX=$(echo "$MATRIX" | jq -c --arg s "$st" --argjson r "$row" '. + [{status:$s,cells:$r}]')
            fi
          done < <(echo "$OPEN_STATUSES" | jq -r '.[]')

          # Drop empty buckets — the default names were unioned in blind, so
          # some may not exist in this portal at all.
          BY_STATUS=$(echo "$BY_STATUS"     | jq -c '[ .[] | select(.value > 0) ]')
          BY_PRIORITY=$(echo "$BY_PRIORITY" | jq -c '[ .[] | select(.value > 0) ]')

          # If the per-status counts do not reconcile with the total, surface
          # the remainder rather than showing a chart that silently undercounts.
          STATUS_SUM=$(echo "$BY_STATUS" | jq '[.[].value] | add // 0')
          if [ "$STATUS_SUM" -lt "$TOTAL" ]; then
            BY_STATUS=$(echo "$BY_STATUS" | jq -c --argjson v "$(( TOTAL - STATUS_SUM ))" \
              '. + [{label:"Other",value:$v}]')
          fi

          # The 100 most recent open tickets, as a browsable list. Note the
          # fields: id, status, priority, category and timestamps only. Subject
          # and requester are free text that names students and staff, and this
          # repo is public — the row links to ManageEngine for those instead.
          echo "=== fetching the 100 most recent open tickets (no subjects) ==="
          RECENT_Q=$(jq -nc --argjson v "$OPEN_STATUSES" \
            '{list_info:{row_count:100,start_index:1,get_total_count:false,
                         fields_required:["id","status","priority","category","created_time","due_by_time"],
                         sort_field:"created_time",sort_order:"desc",
                         search_criteria:[{field:"status.name",condition:"is",values:$v}]}}')
          curl -sS -G "$API/requests" \
            -H "Authorization: Zoho-oauthtoken $ACCESS_TOKEN" \
            -H "$HDR_ACCEPT" \
            --data-urlencode "input_data=$RECENT_Q" -o recent.json
          RECENT=$(jq -c '[ .requests[]? | {
              id: .id,
              status: (.status?.name // null),
              priority: (.priority?.name // null),
              category: (.category?.name // null),
              created: (.created_time?.value // null),
              dueBy: (.due_by_time?.value // null)
            } ]' recent.json 2>/dev/null || echo "[]")
          echo "recent rows: $(echo "$RECENT" | jq 'length')"

          jq -n \
            --arg updatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson recent "$RECENT" \
            --argjson total "$TOTAL" \
            --argjson open "$OPEN" \
            --argjson urgent "$URGENT" \
            --argjson byStatus "$BY_STATUS" \
            --argjson byPriority "$BY_PRIORITY" \
            --argjson byCategory "$BY_CATEGORY" \
            --argjson byTechnician "$BY_TECH" \
            --argjson matrix "$MATRIX" \
            --arg portal "https://sacs.sdpondemand.manageengine.com/app/itdesk/ui/requests" \
            '{updatedAt:$updatedAt,source:"ManageEngine ServiceDesk Plus",
              portalUrl:$portal,
              total:$total,open:$open,urgent:$urgent,
              byStatus:$byStatus,byPriority:$byPriority,
              byCategory:$byCategory,byTechnician:$byTechnician,openMatrix:$matrix,
              recentOpen:$recent}' > summary.json

          {
            echo "// ManageEngine ServiceDesk Plus ticket summary."
            echo "// Generated by .github/workflows/sync-tickets.yml — do not edit by hand."
            echo "//"
            echo "// Aggregate counts only, by design: no ticket subjects, requester"
            echo "// names, or descriptions ever leave ManageEngine. This repo is public."
            echo "const TICKET_SUMMARY = $(cat summary.json);"
          } > data/tickets.js

          echo "=== data/tickets.js ==="
          cat data/tickets.js

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/tickets.js; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tickets.js
          git commit -m "Update ManageEngine ticket counts"
          # Six sync workflows push to main on overlapping schedules, so a
          # plain push loses the race whenever another lands first. Rebase and
          # retry: each workflow owns its own data file, so the rebase cannot
          # conflict — it only needs to move on top of whatever arrived.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt) — rebasing onto origin/main"
            git pull --rebase --autostash origin main || exit 1
            sleep $((attempt * 3))
          done
          echo "still could not push after 5 attempts"
          exit 1
