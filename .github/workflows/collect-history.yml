name: Collect history sample

# Appends one datapoint to data/history.js so the Overview trends panel has a
# real series. Runs after the hourly syncs have landed.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/append-history.js
      - name: Commit if changed
        run: |
          git add data/history.js
          if git diff --cached --quiet -- data/history.js; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Append history sample"
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt) — rebasing onto origin/main"
            git pull --rebase --autostash origin main || exit 1
            sleep $((attempt * 3))
          done
          exit 1
