name: Arctic Wolf API discovery (test)
on: workflow_dispatch

# Base URLs come from the published spec, not from guessing:
#   https://docs.arcticwolf.com/en/developer-and-oem/ticket-api/
#     arctic-wolf-ticket-api/use-the-ticket-api---advanced
#
#   Organizations: https://eloc.global-prod.arcticwolf.net/api/v1/organizations
#   Tickets:       https://ticket-api.managedgw.<pod>-prod.arcticwolf.net
#                    /api/v1/organizations/<organizationId>/tickets
#
# The API lives on arcticwolf.NET; every arcticwolf.com host is either the
# marketing site or the console, which is why earlier probes found nothing.
#
# Arctic Wolf ticket bodies name hosts, users and attack detail. This repo is
# public, so this prints status codes, field NAMES and counts only — never a
# ticket subject, description, or organisation identifier.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Organizations API — find the pod and organisation
        env:
          ARCTICWOLF_API_KEY: ${{ secrets.ARCTICWOLF_API_KEY }}
        run: |
          set -uo pipefail
          echo "api key set: $([ -n "$ARCTICWOLF_API_KEY" ] && echo yes || echo NO)"
          echo ""

          ORG_URL='https://eloc.global-prod.arcticwolf.net/api/v1/organizations'

          # The docs show `Authorization: <token>` in the sample curl without
          # naming a scheme, so try bearer and bare and keep whichever answers.
          for scheme in "Bearer $ARCTICWOLF_API_KEY" "$ARCTICWOLF_API_KEY"; do
            code=$(curl -sS -o org.json -w '%{http_code}' --max-time 30 "$ORG_URL" \
              -H "Authorization: $scheme" -H 'Accept: application/json' || echo 000)
            label=$(echo "$scheme" | grep -q '^Bearer' && echo Bearer || echo bare)
            echo "  Authorization: $label -> HTTP $code"
            if [ "$code" = "200" ]; then AUTH="$scheme"; break; fi
          done

          if [ "${AUTH:-}" = "" ]; then
            echo ""
            echo "Organizations API did not accept the key. Response head:"
            head -c 300 org.json; echo
            echo ""
            echo "The key must be a Personal API Key created in the Unified Portal"
            echo "(dashboard.arcticwolf.com), not the MSP portal."
            exit 1
          fi

          echo ""
          echo "=== organizations ==="
          echo "  top-level type: $(jq -r 'type' org.json)"
          echo "  fields:         $(jq -r 'if type=="array" then (.[0] // {}) else . end | keys | join(", ")' org.json)"
          echo "  count:          $(jq -r 'if type=="array" then length else 1 end' org.json)"
          # Pod is the routing key and is not sensitive. Organisation IDs and
          # names are not printed — the sync rediscovers them each run.
          echo "  pods present:   $(jq -r '[.[]?.pod // empty] | unique | join(", ")' org.json)"

          POD=$(jq -r '[.[]?.pod // empty][0] // empty' org.json)
          ORG=$(jq -r '[.[]?.id // empty][0] // empty' org.json)
          if [ -z "$POD" ] || [ -z "$ORG" ]; then
            echo ""
            echo "Could not read a pod/id pair from the response shape above."
            exit 1
          fi
          echo "::add-mask::$ORG"
          echo ""
          echo "=== ticket API (pod: $POD) ==="

          TICKETS="https://ticket-api.managedgw.${POD}-prod.arcticwolf.net/api/v1/organizations/${ORG}/tickets"
          code=$(curl -sS -o t.json -w '%{http_code}' --max-time 30 "$TICKETS?limit=100&offset=0" \
            -H "Authorization: $AUTH" -H 'Accept: application/json' || echo 000)
          echo "  GET .../tickets?limit=100&offset=0 -> HTTP $code"
          if [ "$code" != "200" ]; then
            echo "  response head: $(head -c 250 t.json)"
            exit 1
          fi

          echo "  envelope fields: $(jq -r 'if type=="object" then (keys|join(", ")) else type end' t.json)"
          LIST='(if type=="array" then . elif has("tickets") then .tickets elif has("data") then .data elif has("items") then .items elif has("results") then .results else [] end)'
          echo "  returned:        $(jq -r "$LIST | length" t.json)"
          echo "  ticket fields:   $(jq -r "$LIST | (.[0] // {}) | keys | join(\", \")" t.json)"
          echo ""
          echo "  --- distribution of every low-cardinality field (no free text) ---"
          # Only fields whose values look like enums are printed. Subjects and
          # descriptions are high-cardinality free text and never qualify.
          jq -r "
            $LIST as \$l
            | (\$l | map(keys) | add // [] | unique) as \$keys
            | \$keys[]
            | . as \$k
            | (\$l | map(.[\$k]) | map(select(type==\"string\" or type==\"number\" or type==\"boolean\"))) as \$vals
            | select((\$vals | length) > 0)
            | (\$vals | unique | length) as \$card
            | select(\$card > 0 and \$card <= 12)
            | \"  \\(\$k): \" + (\$vals | group_by(.) | map(\"\\(.[0])=\\(length)\") | join(\"  \"))
          " t.json 2>/dev/null || echo "  (could not summarise)"
