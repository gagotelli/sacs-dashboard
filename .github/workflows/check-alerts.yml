name: Check alerts

# Evaluates the synced data against thresholds and posts new conditions to
# Teams. Without TEAMS_WEBHOOK_URL it runs as a dry run and only logs, which
# is a safe default — it never silently does nothing without saying so.

on:
  workflow_dispatch:
    inputs:
      force:
        description: >-
          Re-post every active condition even if it has already been
          announced. For testing the Teams webhook and @mentions — without
          it a test run correctly says "nothing new to post" and sends
          nothing, which cannot be told apart from a broken webhook.
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Evaluate thresholds
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          # Optional. Comma-separated UPNs to @mention — a Workflows post into
          # a channel is silent without one, so this is what actually raises a
          # notification. Unset means post exactly as before.
          TEAMS_MENTION: ${{ secrets.TEAMS_MENTION }}
          DASHBOARD_URL: https://gagotelli.github.io/sacs-dashboard/
          FORCE_POST: ${{ inputs.force }}
        run: node scripts/check-alerts.js
      - name: Commit alert state
        run: |
          git add data/alert-state.js
          if git diff --cached --quiet -- data/alert-state.js; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update alert state"
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt) — rebasing onto origin/main"
            git pull --rebase --autostash origin main || exit 1
            sleep $((attempt * 3))
          done
          exit 1
