name: Sync live device status from Auvik

# Populates data/status.js so the topology map, KPI tiles and device table
# show real up/down state instead of "Unknown".
#
# Writes status only for devices already published in data/devices.js —
# Auvik discovers the full estate, and this repo is public.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build data/status.js from Auvik
        env:
          AUVIK_API_USERNAME: ${{ secrets.AUVIK_API_USERNAME }}
          AUVIK_API_KEY: ${{ secrets.AUVIK_API_KEY }}
          AUVIK_API_DOMAIN: ${{ secrets.AUVIK_API_DOMAIN }}
        run: node scripts/auvik-status.js

      - name: Commit if changed
        run: |
          # Stage first: git diff cannot see an untracked file, so a newly
          # generated data/wireless.js would otherwise read as "no change".
          git add data/status.js data/wireless.js
          if git diff --cached --quiet -- data/status.js data/wireless.js; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update live device and wireless status from Auvik"
          git push
