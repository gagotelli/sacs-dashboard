name: Sync live device status from Auvik

# Populates data/status.js so the topology map, KPI tiles and device table
# show real up/down state instead of "Unknown".
#
# Writes status only for devices already published in data/devices.js —
# Auvik discovers the full estate, and this repo is public.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build data/status.js from Auvik
        env:
          AUVIK_API_USERNAME: ${{ secrets.AUVIK_API_USERNAME }}
          AUVIK_API_KEY: ${{ secrets.AUVIK_API_KEY }}
          AUVIK_API_DOMAIN: ${{ secrets.AUVIK_API_DOMAIN }}
        run: node scripts/auvik-status.js

      - name: Commit if changed
        run: |
          # data/wireless.js is owned by the Meraki sync now — this job must
          # not stage it, or the two workflows would fight over the same file.
          git add data/status.js
          if git diff --cached --quiet -- data/status.js; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update live device status from Auvik"
          # Six sync workflows push to main on overlapping schedules, so a
          # plain push loses the race whenever another lands first. Rebase and
          # retry: each workflow owns its own data file, so the rebase cannot
          # conflict — it only needs to move on top of whatever arrived.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt) — rebasing onto origin/main"
            git pull --rebase --autostash origin main || exit 1
            sleep $((attempt * 3))
          done
          echo "still could not push after 5 attempts"
          exit 1
