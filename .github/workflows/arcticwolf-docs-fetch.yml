name: Arctic Wolf docs fetch (test)
on: workflow_dispatch

# The sandbox this repo is developed from can only reach npm/pypi/GitHub, so
# the runner is used purely as a fetcher for the public Arctic Wolf Ticket API
# documentation. No credentials are used here — this touches docs only.

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Sitemap — find the real spec page slugs
        run: |
          set -uo pipefail
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36'
          curl -sSL -A "$UA" -o sitemap.xml 'https://docs.arcticwolf.com/sitemap.xml'
          echo "=== sitemap.xml ==="
          cat sitemap.xml
          echo ""
          echo "=== ticket-api page links found in the section index ==="
          curl -sSL -A "$UA" -o idx.html 'https://docs.arcticwolf.com/en/developer-and-oem/ticket-api'
          grep -oE 'href="[^"]*ticket[^"]*"' idx.html | sort -u

      - name: Extract text from every Ticket API doc page
        run: |
          set -uo pipefail
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36'
          for slug in \
            ticket-api-specifications \
            two-way-pull-api-integrations \
            use-the-ticket-api-beginner \
            use-the-ticket-api-advanced \
            sample-ticket-api-configurations ; do
            u="https://docs.arcticwolf.com/en/developer-and-oem/ticket-api/$slug"
            code=$(curl -sSL -A "$UA" -o p.html -w '%{http_code}' "$u" || echo 000)
            echo ""
            echo "############ $slug -> HTTP $code ($(wc -c < p.html)B)"
            [ "$code" = "200" ] || continue
            python3 - <<'PY'
          import html, re
          src = open('p.html', encoding='utf-8', errors='replace').read()
          body = re.sub(r'(?is)<(script|style|svg|nav|header|footer)\b.*?</\1>', ' ', src)
          text = html.unescape(re.sub(r'(?s)<[^>]+>', '\n', body))
          text = re.sub(r'[ \t\xa0]+', ' ', text)
          lines = [l.strip() for l in text.split('\n')]
          # The chrome (nav tree, language picker, share links) repeats on every
          # page and drowns the content. Keep only what looks like spec prose.
          KEEP = re.compile(r'(https?://|api|API|endpoint|Bearer|header|token|GET |POST |PUT |/v\d|key|auth|curl|json)')
          out, prev = [], None
          for l in lines:
              if not l or l == prev:
                  continue
              if len(l) < 3:
                  continue
              if KEEP.search(l) or len(l) > 60:
                  out.append(l)
              prev = l
          print('\n'.join(out[:220]))
          PY
          done

      - name: DNS for hosts derived from the real portal name
        run: |
          set -uo pipefail
          echo "=== DNS ==="
          for h in dashboard.arcticwolf.com api.dashboard.arcticwolf.com \
                   api-dashboard.arcticwolf.com dashboard-api.arcticwolf.com \
                   ticketapi.arcticwolf.com public-api.arcticwolf.com \
                   api.arcticwolf.io arcticwolf.io; do
            addr=$(getent hosts "$h" 2>/dev/null | head -1 | awk '{print $1}')
            if [ -n "$addr" ]; then
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 12 "https://$h/" || echo 000)
              echo "  $h RESOLVES ($addr)  HTTPS / -> $code"
            else
              echo "  $h no"
            fi
          done
